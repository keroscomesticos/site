<html lang="pt-BR"><head><meta charset="utf-8" />
<title>KEROS — redirecionando</title>
<script>(function(){var known=['/empresa','/marcas','/produtos','/qualidade','/estrutura','/carreiras','/contato','/fale-conosco','/sac','/comercial','/representantes','/fornecedores','/faq','/politica-de-privacidade','/termos-de-uso'];var p=location.pathname;var base='';for(var i=0;i<known.length;i++){var k=known[i];if(k==='/'&&p.length>1&&p.indexOf('/')===0){var rest=p.slice(1);var seg=rest.split('/')[0];if(known.indexOf('/'+seg)===-1){base='/'+seg;break;}}else if(p!==k&&p.indexOf(k+'/')===0){base=k;break;}}location.replace(base+'/#'+p);})();</script>
