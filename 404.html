<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8" />
<title>KEROS — redirecionando</title>
<script>(function(){var p=location.pathname;p=p.replace(/^\/+/,'').replace(/\/+$/,'').split('?')[0];var known=['empresa','marcas','produtos','qualidade','estrutura','carreiras','contato','fale-conosco','sac','comercial','representantes','fornecedores','faq','politica-de-privacidade','termos-de-uso'];var segs=p?p.split('/'):[];var match=null;for(var j=0;j<segs.length;j++){if(known.indexOf(segs[j])!==-1){match=segs.slice(j).join('/');break;}}if(match){location.replace('/?from='+encodeURIComponent(match));return;}if(!p){location.replace('/');return;}location.replace('/?from='+encodeURIComponent(p));})();</script>
<meta http-equiv="refresh" content="5;url=/" /><noscript><meta http-equiv="refresh" content="0;url=/" /></noscript></head>
<body><p>Redirecionando...</p></body></html>
